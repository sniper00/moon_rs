[workspace.lints.rust]
# unsafe_code = "forbid"
# unused = "allow" # For experimental dev.

[workspace]
resolver = "2"
members = [
    "crates/moon-base",
    "crates/moon-runtime",
    "crates/moon-app",
    "crates/moon-game",
    "xtask",
]
exclude = [
    ".extensions",
]

[workspace.dependencies]
moon-runtime = { path = "crates/moon-runtime" }
moon-base = { path = "crates/moon-base", features = ["lua55"] }

mimalloc = "0.1.39"
tokio = { version = "1", features = ["full"] }
log = "0.4.0"
dashmap = "6.1"
lazy_static = "1.4.0"
# Keep Rustls users on AWS-LC instead of linking multiple crypto backends.
reqwest = { version = "0.13", features = ["rustls"]}
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0"}
serde_json = {version = "1.0"}
colored = "3.0"
chrono = "0.4.19"
derive_more = {version = "2", features = ["from"]}
calamine = "0.36"
csv = "1.3.0"
num_cpus = "1.16.0"

bytes = "1.5.0"
base64 = "0.23"
sha2 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
rand = "0.10"

httparse = "1.8.0"
percent-encoding = "2.3.1"
url = "2.5.0"

sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql-rsa", "postgres", "sqlite", "mysql", "chrono", "uuid", "json", "bigdecimal"] }
bigdecimal = "0.4"
phf = { version = "0.14", features = ["macros"] }
uuid = "1"
mongodb = { version = "3.2", default-features = false, features = ["compat-3-0-0", "dns-resolver", "rustls-tls-aws-lc"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-aws-lc", "tls-webpki-roots"] }
tokio-stream = { version = "0.1", features = ["sync"] }
http = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
lexical-core = "1.0"
memchr = "2"

[profile.release]
strip = true
codegen-units = 1
lto = true
# panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 1
